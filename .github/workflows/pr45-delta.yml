name: PR45 delta

on:
  pull_request:

permissions:
  contents: read

jobs:
  delta-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test docs/pr45-delta.test.mjs
